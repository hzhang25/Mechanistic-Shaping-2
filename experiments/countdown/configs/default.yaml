# Countdown expression-shaping config. Every value not taken from Fel et al. 2026 is marked NOT FROM PAPER.
# Override anything on the command line with dotted keys:  --shaping.lam 0.4  --env.target_position uniform

model: Qwen/Qwen3.5-2B          # NOT FROM PAPER: paper uses Qwen/Qwen3.5-9B (see README "choosing the model")
layer: null                      # null = round(0.59 * n_layers), the paper's 19/32 relative depth

env:
  n_operands: 4                  # NOT FROM PAPER
  operand_min: 1                 # NOT FROM PAPER
  operand_max: 25                # NOT FROM PAPER
  target_min: 10                 # NOT FROM PAPER
  target_max: 100                # NOT FROM PAPER
  interval_width: 10             # NOT FROM PAPER
  target_position: lowest        # paper: target = low end of the interval (the giveaway). 'uniform' removes it
  target_file: true              # paper: true. false = no target.txt (best honest performance)
  max_attempts: 5                # NOT FROM PAPER
  max_turns: 10                  # NOT FROM PAPER
  w: 0.2                         # paper

gen:
  temperature: 1.0               # NOT FROM PAPER
  top_p: 1.0                     # NOT FROM PAPER
  max_new_tokens: 512            # NOT FROM PAPER: per assistant turn (thinking disabled)
  max_seq_len: 4096              # NOT FROM PAPER
  gen_batch_size: 64             # throughput only

train:
  updates: 60                    # paper: 150
  n_groups: 8                    # paper: 16 (512 / 32)
  group_size: 16                 # paper: 32
  lr: 2.0e-5                     # NOT FROM PAPER (LoRA lr)
  lora: {r: 64, alpha: 128}      # NOT FROM PAPER for Countdown (paper's harm runs use rank-64 LoRA)
  kl_beta: 0.0                   # NOT FROM PAPER: no KL term
  micro_batch: 4                 # memory only
  grad_ckpt: true                # memory only
  max_grad_norm: 1.0             # NOT FROM PAPER
  ckpt_every: 10                 # paper: checkpoints every 10 updates
  seed: 0

shaping:
  score_mode: none               # none | detached | grad | frozen_ref   (paper's GRPO / (i) / (ii) / (iii))
  baseline: none                 # none | random_v | filter             (paper's baselines)
  lam: 0.4                       # paper
  probe_path: null               # probe .pt from fit_probe.py (required unless score_mode=none)
  score_positions: tool_call     # NOT FROM PAPER: paper says max over "token k" (ambiguous). tool_call | tool_span | all
  refit_every_n: 0               # 0 = never (paper). >0 = refit the shaping probe on the current policy every N updates
  sigma_ref: null                # null = reward std of update 0 (paper: "initial reward standard deviation")

monitor:
  heldout_path: null             # held-out base-model rollouts (fit_probe.py writes it); re-encoded at every checkpoint
